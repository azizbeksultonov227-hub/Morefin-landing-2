<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 178" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6ef"/>
      <stop offset="1" stop-color="#bccadb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e4eaf2"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fa"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="flapShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5b7ba3" flood-opacity=".28"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-40%" width="140%" height="160%">
      <feDropShadow dx="0" dy="-3" stdDeviation="5" flood-color="#6d8ab0" flood-opacity=".18"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="224" height="152" rx="26"/>
    </clipPath>
  </defs>

  <!-- thickness -->
  <rect x="8" y="16" width="224" height="154" rx="26" fill="url(#edge)"/>

  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="224" height="152" rx="26" fill="url(#body)"/>
    <path d="M8 12 L108 94 Q118 103 108 112 L8 162 Z" fill="url(#left)"/>
    <path d="M232 12 L132 94 Q122 103 132 112 L232 162 Z" fill="url(#right)"/>
    <path d="M2 164 L102 98 Q120 86 138 98 L238 164 Z" fill="url(#bottom)" filter="url(#liftShadow)"/>
    <path d="M2 4 L102 100 Q120 116 138 100 L238 4 Z" fill="url(#top)" filter="url(#flapShadow)"/>
    <rect x="8" y="8" width="224" height="152" rx="26" fill="url(#sheen)" opacity=".55"/>
  </g>

  <rect x="9" y="9" width="222" height="150" rx="25" stroke="#ffffff" stroke-opacity=".9" stroke-width="2"/>
</svg>
