<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f427a" />
  <meta name="description" content="Morefin — biznes moliyasini oson boshqaring." />
  <title>Morefin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero" id="home">
      <div class="hero__content">
        <div class="joined">
          <span class="joined__avatars">
            <img src="assets/avatar-1.svg" alt="" />
            <img src="assets/avatar-2.svg" alt="" />
            <img src="assets/avatar-3.svg" alt="" />
          </span>
          <span class="joined__text">10 000+<br />foydalanuvchi</span>
        </div>

        <h1 class="headline">Biznes moliyasini oson boshqaring</h1>

        <p class="lead">
          To‘lovlarni boshqaring, o‘sishni kuzating va moliyaviy jarayonlarni
          har qanday hajmdagi jamoa va biznes uchun qulay platformada soddalashtiring.
        </p>

        <div class="actions">
          <a class="btn btn--primary" href="#start">
            Boshlash
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l4 4-4 4M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </a>
          <a class="btn btn--ghost" href="#demo">Demo ko‘rish</a>
        </div>
      </div>

      <!-- Fan of frosted glass cards -->
      <div class="fan" aria-hidden="true">
        <div class="card" style="--i: -2"></div>
        <div class="card" style="--i: 2"></div>
        <div class="card" style="--i: -1"></div>
        <div class="card" style="--i: 1"></div>
        <div class="card" style="--i: 0"></div>
      </div>
    </section>
  </main>

  <template id="card-face">
    <span class="card__logo"><i></i><i></i></span>
    <span class="card__brand">Morefin</span>
    <span class="card__number">7812 2139 0823 XXXX</span>
    <span class="card__name">Aziz Karimov</span>
    <span class="card__exp"><small>VALID<br />THRU</small>02/29</span>
  </template>

  <script src="js/main.js"></script>
</body>
</html>
