<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3f9bf4" />
  <meta name="description" content="Morefin — biznes moliyasini oson boshqaring." />
  <title>Morefin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero" id="home">
      <div class="hero__glare" aria-hidden="true"></div>

      <!-- Floating money -->
      <div class="money" aria-hidden="true">
        <img class="m m--1" src="assets/banknote.svg" alt="" />
        <img class="m m--2" src="assets/coin.svg" alt="" />
        <img class="m m--3" src="assets/coin.svg" alt="" />
        <img class="m m--4" src="assets/coin.svg" alt="" />
        <img class="m m--5" src="assets/coin-stack.svg" alt="" />
        <img class="m m--6" src="assets/coin.svg" alt="" />
        <img class="m m--7" src="assets/banknote.svg" alt="" />
        <span class="sparkle sparkle--1"></span>
        <span class="sparkle sparkle--2"></span>
        <span class="sparkle sparkle--3"></span>
        <span class="sparkle sparkle--4"></span>
      </div>

      <!-- Navigation -->
      <header class="nav">
        <a class="nav__logo" href="#home" aria-label="Morefin home">
          <span class="logo-mark"></span>
        </a>
        <div class="nav__actions">
          <a class="btn btn--dark btn--sm" href="#start">Start Today</a>
          <button class="nav__toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
            <span></span><span></span>
          </button>
        </div>
        <nav class="menu" id="menu" aria-label="Main">
          <a class="menu__link is-active" href="#home">Home</a>
          <a class="menu__link" href="#solutions">Solutions</a>
          <a class="menu__link" href="#pricing">Pricing</a>
          <a class="menu__link" href="#contact">Contact</a>
        </nav>
      </header>

      <!-- Hero content -->
      <div class="hero__content">
        <h1 class="headline">
          <span class="headline__line">Biznes</span>
          <span class="headline__line">moliyasini</span>
          <span class="headline__line headline__line--tagged">
            <span class="tag" aria-hidden="true"><span class="tag__paper">Aqlli<br />moliya</span></span>
            <span class="headline__word">oson</span>
            <img class="burst" src="assets/burst.svg" alt="" />
          </span>
          <span class="headline__line">boshqaring</span>
        </h1>

        <p class="scribble">Kirim &middot; Chiqim &middot; Foyda</p>

        <div class="hero__cta" id="start">
          <a class="btn btn--dark" href="#start">Start Today</a>
          <a class="btn btn--light" href="#try">Try it first</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
