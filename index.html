<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4ea6f7" />
  <meta name="description" content="Morefin — email, made effortless." />
  <title>Morefin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <section class="hero" id="home">
      <div class="hero__glare" aria-hidden="true"></div>

      <!-- Floating envelopes -->
      <div class="envelopes" aria-hidden="true">
        <img class="env env--1" src="assets/envelope.svg" alt="" />
        <img class="env env--2" src="assets/envelope.svg" alt="" />
        <img class="env env--3" src="assets/envelope.svg" alt="" />
        <img class="env env--4" src="assets/envelope.svg" alt="" />
        <img class="env env--5" src="assets/envelope.svg" alt="" />
        <img class="env env--6" src="assets/envelope.svg" alt="" />
      </div>

      <!-- Navigation -->
      <header class="nav">
        <a class="nav__logo" href="#home" aria-label="Morefin home">
          <span class="logo-mark"></span>
        </a>
        <div class="nav__actions">
          <a class="btn btn--dark btn--sm" href="#start">Start Today</a>
          <button class="nav__toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
            <span></span><span></span>
          </button>
        </div>
        <nav class="menu" id="menu" aria-label="Main">
          <a class="menu__link is-active" href="#home">Home</a>
          <a class="menu__link" href="#solutions">Solutions</a>
          <a class="menu__link" href="#pricing">Pricing</a>
          <a class="menu__link" href="#contact">Contact</a>
        </nav>
      </header>

      <!-- Hero content -->
      <div class="hero__content">
        <div class="proof">
          <span class="proof__avatars">
            <img src="assets/avatar-1.svg" alt="" />
            <img src="assets/avatar-2.svg" alt="" />
            <img src="assets/avatar-3.svg" alt="" />
          </span>
          <span class="proof__text">10,000+ teams already on Morefin</span>
        </div>

        <h1 class="hero__title">Email, made<br />effortless.</h1>

        <p class="hero__text">
          Get <strong>real-time alerts</strong>, smart filters and one calm
          place for every <strong>important message</strong>.
        </p>

        <div class="hero__cta" id="start">
          <a class="btn btn--dark" href="#start">Start Today</a>
          <a class="btn btn--light" href="#try">Try it first</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
